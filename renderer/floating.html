<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <title>Lab show - المشغّل العائم</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            position: relative;
            background: #000;
            border: 1px solid #1f3436;
            border-radius: 10px;
            overflow: hidden;
            -webkit-app-region: drag;
            user-select: none;
            font-family: system-ui, "Segoe UI", Tahoma, sans-serif;
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        canvas {
            position: absolute;
            inset: 0;
            display: none;
            background: #000;
            z-index: 4;
        }
        .pip-title {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            z-index: 8;
            padding: 8px 12px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            background: linear-gradient(transparent, rgba(2, 6, 23, 0.9));
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }
        .pip-controls {
            position: absolute;
            top: 8px;
            left: 8px;
            display: flex;
            gap: 6px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s;
            -webkit-app-region: no-drag;
        }
        body:hover .pip-controls { opacity: 1; }
        button {
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(8, 13, 14, 0.9);
            color: #fff;
            border-radius: 8px;
            padding: 5px 9px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
        }
        button:hover { background: rgba(2, 132, 199, 0.95); }
        button.close-btn:hover { background: rgba(220, 38, 38, 0.95); }
    </style>
</head>

<body>
    <video id="pipVideo" autoplay playsinline muted></video>
    <canvas id="pipFreezeCanvas"></canvas>
    <div class="pip-title" id="pipTitle">Lab show</div>
    <div class="pip-controls">
        <button id="restoreBtn" title="العودة إلى النافذة الرئيسية">توسيع</button>
        <button id="closePipBtn" class="close-btn" title="إغلاق النافذة العائمة">إغلاق ✕</button>
    </div>
    <script>
        function restoreMain() {
            if (window.opener) {
                window.opener.postMessage({ type: 'labshow:restore' }, '*');
                return;
            }
            window.close();
        }
        document.getElementById('restoreBtn').addEventListener('click', restoreMain);
        document.getElementById('closePipBtn').addEventListener('click', restoreMain);
    </script>
</body>

</html>
