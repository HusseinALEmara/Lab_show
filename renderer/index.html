<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https: ws: wss:" />
    <title>Lab show</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header class="app-bar">
        <div class="brand">
            <img class="brand-mark small" src="logo.png" alt="" />
            <div>
                <strong>Lab show</strong>
                <small data-i18n="app.subtitle"></small>
            </div>
        </div>
        <div class="live-status-bar" id="liveStatusBar" hidden>
            <span class="live-dot" aria-hidden="true"></span>
            <span id="liveStatusText"></span>
        </div>
    </header>

    <main class="split">
        <!-- ===== Page 1: create a broadcast link, or join one ===== -->
        <section class="pane welcome-pane" id="welcomePane" hidden>
            <header class="pane-intro">
                <h2 id="welcomeHeading" data-i18n="mesh.welcomeTitle"></h2>
                <p class="hint" data-i18n="mesh.welcomeHint"></p>
            </header>

            <div class="page-tabs" role="tablist">
                <button class="page-tab active" id="tabCreate" type="button" role="tab" aria-selected="true"
                    aria-controls="createCard">
                    <strong data-i18n="mesh.createLink"></strong>
                    <small data-i18n="mesh.hostTag"></small>
                </button>
                <button class="page-tab" id="tabJoin" type="button" role="tab" aria-selected="false"
                    aria-controls="joinCard">
                    <strong data-i18n="mesh.joinLink"></strong>
                    <small data-i18n="mesh.guestTag"></small>
                </button>
            </div>

            <!-- Host: create the link others join with -->
            <div class="card action-card" id="createCard" role="tabpanel" aria-labelledby="tabCreate">
                <p class="hint" data-i18n="mesh.createHint"></p>

                <div class="field">
                    <label class="field-label" for="meshTitle" data-i18n="send.title"></label>
                    <input id="meshTitle" class="title-input" type="text" maxlength="80"
                        data-i18n-placeholder="send.titlePh" />
                </div>

                <div class="form-row">
                    <div class="field">
                        <label class="field-label" for="meshPassword" data-i18n="mesh.password"></label>
                        <input id="meshPassword" class="title-input ltr" type="text" maxlength="32" autocomplete="off"
                            data-i18n-placeholder="mesh.passwordPh" />
                    </div>
                    <div class="field">
                        <label class="field-label" for="meshMaxViewers" data-i18n="mesh.maxViewers"></label>
                        <select id="meshMaxViewers">
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="15">15</option>
                            <option value="20" selected>20</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <span class="field-label" data-i18n="mesh.networkMode"></span>
                    <div class="segmented" id="meshNetworkMode" role="group">
                        <button type="button" data-mode="local" class="active" data-i18n="mesh.modeLocal"></button>
                        <button type="button" data-mode="global" data-i18n="mesh.modeGlobal"></button>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="meshDuration" data-i18n="mesh.duration"></label>
                    <select id="meshDuration">
                        <option value="20" data-i18n="dur.20"></option>
                        <option value="60" data-i18n="dur.60"></option>
                        <option value="180" selected data-i18n="dur.180"></option>
                        <option value="480" data-i18n="dur.480"></option>
                    </select>
                </div>

                <button class="btn-primary full" id="meshCreateBtn" type="button" data-i18n="mesh.create"></button>
                <button class="btn-ghost full" id="btnOpenRoom" type="button" data-i18n="mesh.openRoom"></button>
                <div class="status-text" id="meshCreateStatus" role="status"></div>

                <div class="link-box" id="meshLinkBox" hidden>
                    <div class="link-header">
                        <span class="field-label" data-i18n="recv.link"></span>
                        <button class="btn-ghost small" id="meshCancelLinkBtn" type="button"
                            data-i18n="mesh.cancelLink"></button>
                    </div>
                    <div class="link-row">
                        <code class="link-text ltr" id="meshLinkText"></code>
                        <button class="btn-secondary small" id="meshCopyLinkBtn" type="button"
                            data-i18n="recv.copy"></button>
                    </div>
                    <div class="reach-note" id="meshReachNote" hidden></div>
                </div>

                <button class="btn-secondary full" id="btnViewIncoming" type="button" hidden
                    data-i18n="mesh.viewIncoming"></button>
            </div>

            <!-- Participant: join with a received link -->
            <div class="card action-card" id="joinCard" role="tabpanel" aria-labelledby="tabJoin" hidden>
                <p class="hint" data-i18n="mesh.joinHint"></p>

                <div class="field">
                    <label class="field-label" for="meshJoinLink" data-i18n="join.link"></label>
                    <input id="meshJoinLink" class="title-input ltr" type="text" autocomplete="off"
                        data-i18n-placeholder="join.linkPh" />
                </div>

                <div class="form-row">
                    <div class="field">
                        <label class="field-label" for="meshJoinPassword" data-i18n="mesh.password"></label>
                        <input id="meshJoinPassword" class="title-input ltr" type="text" maxlength="32"
                            autocomplete="off" data-i18n-placeholder="mesh.passwordPh" />
                    </div>
                    <div class="field">
                        <label class="field-label" for="meshJoinName" data-i18n="join.name"></label>
                        <input id="meshJoinName" class="title-input" type="text" maxlength="80" autocomplete="off"
                            data-i18n-placeholder="pub.namePh" />
                    </div>
                </div>

                <button class="btn-primary full" id="meshJoinBtn" type="button" data-i18n="mesh.join"></button>
                <div class="status-text" id="meshJoinStatus" role="status"></div>
                <button class="btn-secondary full" id="btnViewLive" type="button" data-i18n="mesh.viewLive"
                    hidden></button>
            </div>

            <!-- Live broadcast view, inline on the same page -->
            <div class="card live-card" id="liveContainer" hidden>
                <div class="broadcast-header">
                    <h3 data-i18n="mesh.viewLive"></h3>
                </div>
                <div class="broadcast-body" id="liveBody">
                    <div class="card viewer-card" id="inlineViewerCard" hidden>
                        <div class="video-box">
                            <video id="inlineRemoteVideo" autoplay playsinline></video>
                            <div class="viewer-title" id="inlineViewerTitle"></div>
                        </div>
                    </div>
                    <div class="card waiting-card" id="inlineWaitingCard" hidden>
                        <div class="placeholder-icon" aria-hidden="true">▣</div>
                        <p data-i18n="recv.placeholder"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ===== Page 2: broadcast / watch ===== -->
        <section class="pane broadcast-pane" id="broadcastPane" hidden>
            <header class="broadcast-header">
                <div class="broadcast-titles">
                    <h2 id="broadcastHeading" data-i18n="mesh.broadcastTitle"></h2>
                    <span class="broadcast-meta" id="broadcastMeta"></span>
                </div>
                <button class="btn-ghost" id="btnBackToWelcome" type="button"
                    data-i18n="mesh.backToWelcome"></button>
            </header>

            <div class="broadcast-body">
                <!-- Broadcaster view -->
                <div class="card broadcaster-card" id="broadcasterCard" hidden>
                    <div class="video-box">
                        <video id="selfVideo" autoplay playsinline muted></video>
                        <div class="self-label" id="selfLabel"></div>
                    </div>
                    <div class="broadcaster-controls">
                        <button class="btn-primary full" id="btnStartBroadcast" type="button"
                            data-i18n="mesh.startBroadcast"></button>
                        <button class="btn-danger full" id="btnStopBroadcast" type="button"
                            data-i18n="mesh.stopBroadcast" hidden></button>
                        <button class="btn-ghost full" id="btnControlToggle" type="button"
                            data-i18n="control.allow" hidden></button>
                        <div class="status-row">
                            <span class="pill" id="broadcastPill"></span>
                            <span id="viewerCount" data-i18n="mesh.viewers"></span>
                        </div>
                        <div class="relay-control" id="relayControl" hidden>
                            <button class="btn-secondary" id="btnToggleRelay" type="button"
                                data-i18n="mesh.beRelay"></button>
                            <span id="relayStatus" data-i18n="mesh.relayOff"></span>
                        </div>
                    </div>
                </div>

                <!-- Viewer view -->
                <div class="card viewer-card" id="viewerCard" hidden>
                    <div class="video-box">
                        <video id="remoteVideo" autoplay playsinline></video>
                        <div class="viewer-title" id="viewerTitle"></div>
                        <div class="video-controls">
                            <button class="video-btn" id="btnReceiverPause" type="button"
                                data-i18n-title="video.pause">⏸</button>
                            <button class="video-btn" id="btnFullscreen" type="button" data-i18n-title="video.full">
                                <svg id="expandIcon" width="17" height="17" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2.2">
                                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                                </svg>
                                <svg id="compressIcon" width="17" height="17" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2.2" style="display:none">
                                    <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="viewer-controls">
                        <div class="status-row">
                            <span class="pill" id="viewerPill"></span>
                            <span id="viewerCountDisplay" data-i18n="mesh.viewers"></span>
                        </div>
                        <div class="relay-control" id="viewerRelayControl" hidden>
                            <button class="btn-secondary" id="btnViewerRelay" type="button"
                                data-i18n="mesh.beRelay"></button>
                            <span id="viewerRelayStatus" data-i18n="mesh.relayOff"></span>
                        </div>
                        <div class="key-pad" id="keyPad" hidden>
                            <span class="field-label" data-i18n="keys.heading"></span>
                            <div class="remote-key-grid">
                                <button type="button" data-key="Enter">Enter</button>
                                <button type="button" data-key="Space">Space</button>
                                <button type="button" data-key="Escape">Esc</button>
                                <button type="button" data-key="ArrowUp">↑</button>
                                <button type="button" data-key="ArrowLeft">←</button>
                                <button type="button" data-key="ArrowDown">↓</button>
                                <button type="button" data-key="ArrowRight">→</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Waiting / role not set -->
                <div class="card waiting-card" id="waitingCard">
                    <div class="placeholder-icon" aria-hidden="true">▣</div>
                    <p id="waitingText" data-i18n="recv.placeholder"></p>
                </div>
            </div>
        </section>
    </main>

    <script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script>
    <script src="../src/media/adaptive-quality.js"></script>
    <script src="../src/config/protocol.js"></script>
    <script src="../src/network/links.js"></script>
    <script src="../src/ui/i18n.js"></script>
    <script src="../src/ui/screen-adapter.js"></script>
    <script src="../src/ui/settings.js"></script>
    <script src="../src/media/ws-media.js"></script>
    <script src="../src/ui/app.js"></script>
</body>

</html>
