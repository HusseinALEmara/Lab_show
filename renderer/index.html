<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https: ws: wss:" />
    <title>Lab show</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body class="app-page">
    <header class="app-bar">
        <div class="brand">
            <img class="brand-mark small" src="logo.png" alt="" />
            <div>
                <strong>Lab show</strong>
                <small data-i18n="app.subtitle"></small>
            </div>
        </div>
        <div class="live-status-bar" id="liveStatusBar" hidden>
            <span class="live-dot" aria-hidden="true"></span>
            <span id="liveStatusText"></span>
        </div>
    </header>

    <!-- الشاشتان لا تظهران معاً: لكل واحدة زر خاص بها في الشريط العلوي -->
    <nav class="screen-nav" role="navigation">
        <button class="screen-link active" id="navCreate" type="button" aria-current="page"
            data-i18n="nav.create"></button>
        <button class="screen-link" id="navSend" type="button" data-i18n="nav.send"></button>
    </nav>

    <main class="screens">
        <!-- ===== الشاشة 1: إنشاء (رموز وجلسات) ===== -->
        <section class="screen create-screen" id="screenCreate" aria-labelledby="recvHeading">
            <h2 id="recvHeading" data-i18n="create.heading"></h2>
            <p class="hint" data-i18n="create.hint"></p>

            <div id="codeSettingsCard" class="create-forms">
                <div class="pane-tabs" id="createTabs" role="tablist">
                    <button class="pane-tab active" id="createTabPrivate" type="button" role="tab"
                        aria-selected="true" aria-controls="createPanelPrivate" data-tab="private"
                        data-i18n="tab.single"></button>
                    <button class="pane-tab" id="createTabPublic" type="button" role="tab" aria-selected="false"
                        aria-controls="createPanelPublic" data-tab="public" data-i18n="tab.public"></button>
                    <button class="pane-tab" id="createTabMulti" type="button" role="tab" aria-selected="false"
                        aria-controls="createPanelMulti" data-tab="multi" data-i18n="tab.multi"></button>
                </div>

                <!-- خاص لشخص واحد: رمز يدخل به جهاز واحد شاشته. -->
                <div class="tab-panel" id="createPanelPrivate" role="tabpanel">
                    <div class="card">
                        <p class="hint" data-i18n="create.privateHint"></p>
                        <label class="field-label" for="durationSelect" data-i18n="recv.duration"></label>
                        <select id="durationSelect">
                            <option value="20" data-i18n="dur.20"></option>
                            <option value="60" data-i18n="dur.60"></option>
                            <option value="180" selected data-i18n="dur.180"></option>
                            <option value="480" data-i18n="dur.480"></option>
                        </select>
                        <label class="field-label" data-i18n="net.label"></label>
                        <div class="segmented" id="networkModeSelect" role="group">
                            <button type="button" data-mode="local" class="active" data-i18n="net.local"></button>
                            <button type="button" data-mode="global" data-i18n="net.global"></button>
                        </div>
                        <button class="btn-primary full generate-btn" id="generateBtn" type="button" disabled
                            data-i18n="recv.generate"></button>
                    </div>
                </div>

                <!-- بث عام: رمز ورابط يصلان إلى أي جهاز. -->
                <div class="tab-panel" id="createPanelPublic" role="tabpanel" hidden>
                    <div class="card">
                        <p class="hint" data-i18n="create.publicHint"></p>
                        <label class="field-label" for="publicDurationSelect" data-i18n="recv.duration"></label>
                        <select id="publicDurationSelect">
                            <option value="20" data-i18n="dur.20"></option>
                            <option value="60" data-i18n="dur.60"></option>
                            <option value="180" selected data-i18n="dur.180"></option>
                            <option value="480" data-i18n="dur.480"></option>
                        </select>
                        <label class="field-label" data-i18n="net.label"></label>
                        <div class="segmented" id="publicNetworkMode" role="group">
                            <button type="button" data-mode="local" data-i18n="net.local"></button>
                            <button type="button" data-mode="global" class="active" data-i18n="net.global"></button>
                        </div>
                        <button class="btn-primary full generate-btn" id="publicGenerateBtn" type="button" disabled
                            data-i18n="recv.generate"></button>
                    </div>
                </div>

                <!-- بث عمومي لعدة مشاهدين: رمز يستقبل شاشات عدة أجهزة. -->
                <div class="tab-panel" id="createPanelMulti" role="tabpanel" hidden>
                    <div class="card">
                        <p class="hint" data-i18n="create.multiHint"></p>
                        <label class="field-label" for="multiDurationSelect" data-i18n="recv.duration"></label>
                        <select id="multiDurationSelect">
                            <option value="20" data-i18n="dur.20"></option>
                            <option value="60" data-i18n="dur.60"></option>
                            <option value="180" selected data-i18n="dur.180"></option>
                            <option value="480" data-i18n="dur.480"></option>
                        </select>
                        <label class="field-label" data-i18n="net.label"></label>
                        <div class="segmented" id="multiNetworkMode" role="group">
                            <button type="button" data-mode="local" class="active" data-i18n="net.local"></button>
                            <button type="button" data-mode="global" data-i18n="net.global"></button>
                        </div>
                        <button class="btn-primary full generate-btn" id="multiGenerateBtn" type="button" disabled
                            data-i18n="recv.generate"></button>
                    </div>
                </div>
            </div>

            <div class="status-text" id="hostStatus" role="status"></div>

            <div class="card" id="generatedBox" hidden>
                <div class="share-row">
                    <span class="field-label" data-i18n="recv.code"></span>
                    <div class="generated-code ltr" id="generatedCode">------</div>
                    <button class="btn-secondary small" id="copyCodeBtn" type="button"
                        data-i18n="recv.copy"></button>
                </div>
                <div class="share-row">
                    <span class="field-label" data-i18n="recv.link"></span>
                    <code class="link-text ltr" id="globalLinkText"></code>
                    <button class="btn-secondary small" id="copyGlobalLinkBtn" type="button"
                        data-i18n="recv.copy"></button>
                </div>
                <div class="reach-note" id="reachNote" hidden></div>
                <div class="meta-row">
                    <span id="generatedTitle"></span>
                    <span id="hostTimer"></span>
                    <span id="hostStateText"></span>
                </div>
                <button class="btn-danger full" id="deleteCodeBtn" type="button" data-i18n="recv.end"></button>
            </div>

            <!-- استقبال البثوث: الشاشات الواردة وقائمتها -->
            <div class="broadcasts-layout">
                <section class="stage-column">
                    <div class="video-box" id="videoBox">
                        <video id="remoteVideo" autoplay playsinline muted></video>
                        <canvas id="freezeCanvas" class="freeze-canvas"></canvas>
                        <div class="viewer-title" id="viewerTitle"></div>
                        <div class="video-controls">
                            <button class="video-btn" id="receiverPauseBtn" type="button" data-i18n-title="video.pause">⏸</button>
                            <button class="video-btn" id="floatBtn" type="button" data-i18n-title="video.float">
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="16" rx="2" />
                                    <rect x="12" y="12" width="7" height="6" rx="1" fill="currentColor" />
                                </svg>
                            </button>
                            <button class="video-btn" id="fullscreenBtn" type="button" data-i18n-title="video.full">
                                <svg id="expandIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                                </svg>
                                <svg id="compressIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="display:none">
                                    <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="video-placeholder" id="videoPlaceholder">
                        <div class="placeholder-icon" aria-hidden="true">▣</div>
                        <p data-i18n="recv.placeholder"></p>
                    </div>
                </section>

                <aside class="roster-column">
                    <div class="card roster-card" id="rosterCard">
                        <div class="roster-heading">
                            <h3 data-i18n="recv.list"></h3>
                            <button class="btn-ghost small" id="rosterViewBtn" type="button" data-i18n="recv.gridView"></button>
                        </div>
                        <div class="student-roster" id="studentRoster"></div>
                        <div class="status-text" id="emptyRoster" data-i18n="recv.empty"></div>
                    </div>

                    <div class="card" id="teacherControlsCard" hidden>
                        <h3 data-i18n="keys.heading"></h3>
                        <p class="hint" data-i18n="keys.hint"></p>
                        <div class="remote-status" id="teacherControlStatus"></div>
                        <div class="direction-pad">
                            <button class="key-up" data-remote-key="ArrowUp" type="button" aria-label="↑">↑</button>
                            <span aria-hidden="true"></span>
                            <span aria-hidden="true"></span>
                            <button data-remote-key="ArrowLeft" type="button" aria-label="←">←</button>
                            <button data-remote-key="ArrowDown" type="button" aria-label="↓">↓</button>
                            <button data-remote-key="ArrowRight" type="button" aria-label="→">→</button>
                        </div>
                        <div class="remote-key-grid">
                            <button data-remote-key="Enter" type="button" data-i18n="key.Enter"></button>
                            <button data-remote-key="Space" type="button" data-i18n="key.Space"></button>
                            <button data-remote-key="Escape" type="button" data-i18n="key.Escape"></button>
                            <button data-remote-key="Tab" type="button" data-i18n="key.Tab"></button>
                            <button data-remote-key="PageUp" type="button" data-i18n="key.PageUp"></button>
                            <button data-remote-key="PageDown" type="button" data-i18n="key.PageDown"></button>
                            <button data-remote-key="Home" type="button" data-i18n="key.Home"></button>
                            <button data-remote-key="End" type="button" data-i18n="key.End"></button>
                        </div>
                    </div>
                </aside>
            </div>
        </section>

        <!-- ===== الشاشة 2: الإرسال والانضمام ===== -->
        <section class="screen send-screen" id="screenSend" hidden aria-labelledby="sendHeading">
            <h2 id="sendHeading" data-i18n="send.heading"></h2>
            <p class="hint" data-i18n="send.hint"></p>

            <div class="pane-tabs" id="sendTabs" role="tablist">
                <button class="pane-tab active" id="sendTabDirect" type="button" role="tab" aria-selected="true"
                    aria-controls="sendPanelDirect" data-tab="direct" data-i18n="tab.single"></button>
                <button class="pane-tab" id="sendTabJoin" type="button" role="tab" aria-selected="false"
                    aria-controls="sendPanelJoin" data-tab="join" data-i18n="tab.public"></button>
                <button class="pane-tab" id="sendTabPublic" type="button" role="tab" aria-selected="false"
                    aria-controls="sendPanelPublic" data-tab="public" data-i18n="tab.multi"></button>
            </div>

            <!-- خاص لشخص واحد: أرسل شاشتي إلى جهاز واحد. -->
            <div class="tab-panel" id="sendPanelDirect" role="tabpanel">
                <div class="card" id="codeCard">
                    <label class="field-label" for="codeInput" data-i18n="send.code"></label>
                    <input id="codeInput" class="code-input ltr" type="text" maxlength="12" autocomplete="off"
                        data-i18n-placeholder="send.codePh" />
                    <label class="field-label" for="sendLinkInput" data-i18n="send.link"></label>
                    <input id="sendLinkInput" class="title-input ltr" type="text" autocomplete="off"
                        data-i18n-placeholder="send.linkPh" />
                    <label class="field-label" for="joinTitleInput" data-i18n="send.title"></label>
                    <input id="joinTitleInput" class="title-input" type="text" maxlength="80" autocomplete="off"
                        data-i18n-placeholder="send.titlePh" />
                    <div class="btn-row">
                        <button class="btn-ghost" id="cancelCodeBtn" type="button" data-i18n="send.cancel"></button>
                        <button class="btn-primary" id="approveCodeBtn" type="button" data-i18n="send.start"></button>
                    </div>
                    <div class="status-text" id="outgoingStatus" role="status"></div>
                </div>

                <div class="card status-card" id="broadcastCard" hidden>
                    <div class="status-row">
                        <span class="pill" id="broadcastStatusPill"></span>
                        <span class="identity-chip ltr" id="studentIdentity"></span>
                    </div>
                    <button class="title-display" id="titleDisplayBtn" type="button">
                        <span id="titleDisplayText">—</span>
                        <span class="edit-hint" data-i18n="send.editHint"></span>
                    </button>
                    <div class="inline-form" id="titleEditor" hidden>
                        <input id="broadcastTitleInput" class="title-input" type="text" maxlength="80"
                            autocomplete="off" />
                        <button class="btn-secondary" id="titleUpdateBtn" type="button" data-i18n="send.update"></button>
                    </div>
                    <button class="btn-warning full" id="studentControlToggle" type="button" role="switch"
                        aria-checked="false" disabled></button>
                    <div class="split-row">
                        <button class="btn-secondary" id="pauseBroadcastBtn" type="button" disabled></button>
                        <button class="btn-danger" id="stopBroadcastBtn" type="button" data-i18n="send.stop"></button>
                    </div>
                    <div class="remote-status" id="studentControlStatus"></div>
                </div>
            </div>

            <!-- بث عام: انضم إلى بث عمومي برابطه. -->
            <div class="tab-panel" id="sendPanelJoin" role="tabpanel" hidden>
                <div class="card" id="joinCard">
                    <p class="hint" data-i18n="join.hint"></p>
                    <label class="field-label" for="joinLinkInput" data-i18n="join.link"></label>
                    <input id="joinLinkInput" class="title-input ltr" type="text" autocomplete="off"
                        data-i18n-placeholder="join.linkPh" />
                    <label class="field-label" for="joinNameInput" data-i18n="join.name"></label>
                    <input id="joinNameInput" class="title-input" type="text" maxlength="80" autocomplete="off"
                        data-i18n-placeholder="pub.namePh" />
                    <button class="btn-secondary full" id="joinRoomBtn" type="button"
                        data-i18n="join.button"></button>
                    <div class="status-text" id="joinStatus" role="status"></div>
                </div>
            </div>

            <!-- بث عمومي لعدة مشاهدين: ابدأ بثك ليراه عدة أشخاص. -->
            <div class="tab-panel" id="sendPanelPublic" role="tabpanel" hidden>
                <div class="card" id="publicCard">
                    <p class="hint" data-i18n="pub.hint"></p>
                    <label class="field-label" for="pubTitleInput" data-i18n="pub.title"></label>
                    <input id="pubTitleInput" class="title-input" type="text" maxlength="80" autocomplete="off"
                        data-i18n-placeholder="pub.titlePh" />
                    <label class="field-label" for="pubNameInput" data-i18n="pub.name"></label>
                    <input id="pubNameInput" class="title-input" type="text" maxlength="80" autocomplete="off"
                        data-i18n-placeholder="pub.namePh" />
                    <label class="field-label" data-i18n="net.label"></label>
                    <div class="segmented" id="pubNetworkMode" role="group">
                        <button type="button" data-mode="local" class="active" data-i18n="net.local"></button>
                        <button type="button" data-mode="global" data-i18n="net.global"></button>
                    </div>
                    <label class="field-label" for="pubDurationSelect" data-i18n="pub.duration"></label>
                    <select id="pubDurationSelect">
                        <option value="60" data-i18n="dur.60"></option>
                        <option value="180" selected data-i18n="dur.180"></option>
                        <option value="480" data-i18n="dur.480"></option>
                    </select>
                    <button class="btn-primary full" id="pubStartBtn" type="button" data-i18n="pub.start"></button>
                    <div class="status-text" id="pubStatus" role="status"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script>
    <script src="../src/adaptive-quality.js"></script>
    <script src="../src/protocol.js"></script>
    <script src="../src/links.js"></script>
    <script src="i18n.js"></script>
    <script src="settings.js"></script>
    <script src="ws-media.js"></script>
    <script src="app.js"></script>
</body>

</html>
